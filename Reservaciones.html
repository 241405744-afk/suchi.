<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Sushi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            padding: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid #e74c3c; /* Rojo estilo sushi/salmón */
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        fieldset {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        legend {
            font-weight: bold;
            color: #e74c3c;
            padding: 0 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-group, .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .checkbox-item, .radio-item {
            display: flex;
            align-items: center;
        }
        .checkbox-item input, .radio-item input {
            margin-right: 8px;
        }
        button {
            width: 100%;
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2> Haz tu Pedido de Sushi</h2>
    
    <form action="#" method="POST">
        
        <!-- Datos de contacto -->
        <fieldset>
            <legend>1. Tus Datos</legend>
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="">
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="">
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico (Opcional):</label>
                <input type="email" id="email" name="email" placeholder="">
            </div>
        </fieldset>

        <!-- Selección de Sushi -->
        <fieldset>
            <legend>2. Selecciona tu Sushi</legend>
            <p style="margin-top: 0; font-size: 14px; color: #666;">Elige tus favoritos (puedes marcar varios):</p>
            
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="sushi1" name="sushi[]" value="California Roll">
                    <label for="sushi1">California Roll (8 pzs)</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="sushi2" name="sushi[]" value="Philadelphia Roll">
                    <label for="sushi2">Philadelphia Roll (8 pzs)</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="sushi3" name="sushi[]" value="Avocado Roll">
                    <label for="sushi3">Avocado Roll (8 pzs)</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="sushi4" name="sushi[]" value="Nigiri Salmón">
                    <label for="sushi4">Nigiri de Salmón (4 pzs)</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="sushi5" name="sushi[]" value="Temaki Atún">
                    <label for="sushi5">Temaki de Atún Spiced</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="sushi6" name="sushi[]" value="Gyozas">
                    <label for="sushi6">Gyozas de Cerdo (5 pzs)</label>
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label for="cantidad">¿Cuántas cajas/combos en total?:</label>
                <input type="number" id="cantidad" name="cantidad" min="1" max="10" value="1" required>
            </div>
        </fieldset>

        <!-- Preferencias y Extras -->
        <fieldset>
            <legend>3. Extras y Alergias</legend>
            <div class="form-group">
                <label>Salsa adicional:</label>
                <select name="salsa">
                    <option value="soya">Salsa de Soya estándar</option>
                    <option value="soya_baja">Salsa de Soya baja en sodio</option>
                    <option value="anguila">Salsa de Anguila (Dulce)</option>
                    <option value="teriyaki">Salsa Teriyaki</option>
                    <option value="ninguna">Sin salsas</option>
                </select>
            </div>

            <div class="form-group">
                <label>¿Palillos (Ohashi) necesarios?:</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="palillos_si" name="palillos" value="si" checked>
                        <label for="palillos_si">Sí, por favor</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="palillos_no" name="palillos" value="no">
                        <label for="palillos_no">No, gracias</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="notas">Instrucciones especiales o alergias:</label>
                <textarea id="notas" name="notas" rows="3" placeholder="Ej. Sin sésamo, salsa aparte, etc..."></textarea>
            </div>
        </fieldset>

        <!-- Tipo de entrega -->
        <fieldset>
            <legend>4. Entrega</legend>
            <div class="form-group">
                <label>Método de entrega:</label>
                <select name="entrega" id="entrega">
                    <option value="domicilio">A domicilio (Delivery)</option>
                    <option value="sucursal">Retiro en sucursal (Take Away)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="direccion">Dirección de entrega (si aplica):</label>
                <input type="text" id="direccion" name="direccion" placeholder="Calle, número, departamento...">
            </div>
        </fieldset>

        <button type="submit">Enviar Pedido 🍣</button>
    </form>
</div>

</body>
</html>
