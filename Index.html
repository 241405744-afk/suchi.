    <style>
    
body {
  margin: 0;

.barra-lateral {
  position: fixed;
  top: 0;
  left: 0;
  width: 200px;
  height: 100%;
  background-color: #9be5bb;
  display: flex;
  flex-direction: column;
  padding-top: 20px;
}

.boton {
  color: white;
  text-decoration: none;
  padding: 15px;
  margin: 5px 10px;
  background-color: #55e897; 
  border-radius: 5px;
  text-align: center;
  transition: transform 0.3s ease, background-color 0.3s ease;
}


.boton:hover {
  background-color: #5ce8ba; 
  transform: scale(1.1);
}

.contenido {
  margin-left: 220px; 
  padding: 20px;
}

.sombra-suave{
  font-size:x-large;
  color: #bcefb7;
  text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
}

.degradado {
  background: linear-gradient(to right, #110d10, #e9dcca);
  -webkit-ackground-clip: text;
  -webkit-text-fill-color: transparent;
}
.borde-texto {
  color: rgb(231, 188, 188);
  font-weight: bold;
  -webkit-text-stroke: 1px black;
}

.flotante {
  animation: flotar 2s ease-in-out infinite;
}
@keyframes flotar {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.fondo-resaltado {
  background-color: #faf4dd;
  padding: 5px 10px;
  border-radius: 5px;
  color: #2d3436;
}
